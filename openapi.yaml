openapi: 3.0.3
info:
  title: Mon École API
  version: 1.0.0
  description: School management system API.
paths:
  /api/v1/academic-years/:
    get:
      operationId: academic_years_list
      description: |-
        CRUD for school-owned records: scoped to the current school, audited on every write.

        Subclasses set `queryset`, `serializer_class`, `required_permissions` and `audit_module`.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - academic-years
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicYear'
          description: ''
    post:
      operationId: academic_years_create
      description: |-
        CRUD for school-owned records: scoped to the current school, audited on every write.

        Subclasses set `queryset`, `serializer_class`, `required_permissions` and `audit_module`.
      tags:
      - academic-years
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicYearRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcademicYearRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcademicYearRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicYear'
          description: ''
