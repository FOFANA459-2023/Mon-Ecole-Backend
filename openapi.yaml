        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - academic-years
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AcademicYear'
          description: ''
    post:
      operationId: academic_years_create
