      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemberUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMemberUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMemberUpdateRequest'
      security:
      - jwtAuth: []
