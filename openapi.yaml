  /api/v1/enrollments/:
    get:
      operationId: enrollments_list
      description: |-
        CRUD for school-owned records: scoped to the current school, audited on every write.

        Subclasses set `queryset`, `serializer_class`, `required_permissions` and `audit_module`.
      parameters:
      - in: query
        name: academic_year
        schema:
          type: integer
      - in: query
        name: class_group
        schema:
          type: integer
      - in: query
        name: class_group__level
        schema:
          type: integer
      - in: query
        name: enrollment_date__gte
        schema:
          type: string
          format: date
      - in: query
        name: enrollment_date__lte
        schema:
          type: string
          format: date
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - new
          - re_enrolment
          - transfer_in
        description: |-
          * `new` - New student
          * `re_enrolment` - Re-enrolment
          * `transfer_in` - Transfer from another school
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - cancelled
          - class_changed
          - completed
          - withdrawn
        description: |-
          * `active` - Active
          * `class_changed` - Moved to another class
          * `withdrawn` - Left the school
          * `completed` - Year completed
          * `cancelled` - Cancelled
      - in: query
        name: status__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: student
        schema:
          type: integer
      tags:
      - enrollments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnrollmentList'
          description: ''
    post:
      operationId: enrollments_create
