        '204':
          description: No response body
components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: e.g. 2026-2027
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_current:
          type: boolean
          readOnly: true
        status:
          $ref: '#/components/schemas/YearStatusEnum'
        terms:
          type: array
          items:
            $ref: '#/components/schemas/Term'
          readOnly: true
      required:
      - end_date
      - id
      - is_current
      - name
      - start_date
      - terms
    AcademicYearRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: e.g. 2026-2027
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/YearStatusEnum'
        term_count:
          type: integer
          maximum: 6
          minimum: 0
          writeOnly: true
      required:
      - end_date
      - name
      - start_date
    ArchiveStatusEnum:
      enum:
      - active
      - archived
      type: string
      description: |-
        * `active` - Active
        * `archived` - Archived
    AssignmentSubject:
      type: object
      properties:
        id:
          type: integer
        class_name:
          type: string
        subject_name:
          type: string
      required:
      - class_name
      - id
      - subject_name
    Assignments:
      type: object
      properties:
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentSubject'
        homeroom_classes:
          type: array
          items:
            $ref: '#/components/schemas/Homeroom'
      required:
      - homeroom_classes
      - subjects
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          readOnly: true
        module:
          type: string
          readOnly: true
        entity_type:
          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
        old_values:
          readOnly: true
          nullable: true
        new_values:
          readOnly: true
          nullable: true
        user:
          type: integer
          readOnly: true
          nullable: true
        user_name:
          type: string
          readOnly: true
        ip:
          type: string
          readOnly: true
          nullable: true
        user_agent:
          type: string
          readOnly: true
        request_id:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - created_at
      - entity_id
      - entity_type
      - id
      - ip
      - module
      - new_values
      - old_values
      - request_id
      - summary
      - user
      - user_agent
      - user_name
    BlankEnum:
      enum:
      - ''
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - reason
    CategoryEnum:
      enum:
      - birth_certificate
      - id_photo
      - previous_report
      - transfer_certificate
      - medical
      - identity
      - diploma
      - contract
      - official
      - other
      type: string
      description: |-
        * `birth_certificate` - Birth certificate
        * `id_photo` - ID photo
        * `previous_report` - Previous report card
        * `transfer_certificate` - Transfer certificate
        * `medical` - Medical record
        * `identity` - Identity document
        * `diploma` - Diploma / certificate
        * `contract` - Contract
        * `official` - Official document
        * `other` - Other
    ChangeClassRequest:
      type: object
      properties:
        class_group:
          type: integer
        date:
          type: string
          format: date
        reason:
          type: string
          default: ''
          maxLength: 255
      required:
      - class_group
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - current_password
      - new_password
    ClassGroup:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        academic_year:
          type: integer
        academic_year_name:
          type: string
          readOnly: true
        level:
          type: integer
        level_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 50
        room:
          type: string
          maxLength: 50
        class_teacher:
          type: integer
          nullable: true
        class_teacher_name:
          type: string
          readOnly: true
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        status:
          $ref: '#/components/schemas/ArchiveStatusEnum'
        enrolled_count:
          type: integer
          readOnly: true
        subject_count:
          type: integer
          readOnly: true
      required:
      - academic_year
      - academic_year_name
      - class_teacher_name
      - enrolled_count
      - id
      - level
      - level_name
      - name
      - subject_count
    ClassGroupRequest:
      type: object
      properties:
        academic_year:
          type: integer
        level:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 50
        room:
          type: string
          maxLength: 50
        class_teacher:
          type: integer
          nullable: true
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        status:
          $ref: '#/components/schemas/ArchiveStatusEnum'
      required:
      - academic_year
      - level
      - name
    ClassSubject:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        class_group:
          type: integer
        class_name:
          type: string
          readOnly: true
        subject:
          type: integer
        subject_name:
          type: string
          readOnly: true
        subject_code:
          type: string
          readOnly: true
        teacher:
          type: integer
          nullable: true
        teacher_name:
          type: string
          readOnly: true
        coefficient:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
        weekly_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
      required:
      - class_group
      - class_name
      - id
      - subject
      - subject_code
      - subject_name
      - teacher_name
    ClassSubjectRequest:
      type: object
      properties:
        class_group:
          type: integer
        subject:
          type: integer
        teacher:
          type: integer
          nullable: true
        coefficient:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
        weekly_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          nullable: true
      required:
      - class_group
      - subject
    CycleEnum:
      enum:
      - preschool
      - primary
      - lower_secondary
      - upper_secondary
      - other
      type: string
      description: |-
        * `preschool` - Preschool
        * `primary` - Primary
        * `lower_secondary` - Lower secondary
        * `upper_secondary` - Upper secondary
        * `other` - Other
    Document:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner_type:
          $ref: '#/components/schemas/OwnerTypeEnum'
        owner_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        category:
          $ref: '#/components/schemas/CategoryEnum'
        title:
          type: string
          maxLength: 200
        content_type:
          type: string
          maxLength: 100
        size:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        uploaded_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - owner_id
      - owner_type
      - title
      - uploaded_by_name
    DocumentUploadRequest:
      type: object
      properties:
        owner_type:
          $ref: '#/components/schemas/OwnerTypeEnum'
        owner_id:
          type: integer
          minimum: 0
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          default: other
        title:
          type: string
          maxLength: 200
        file:
          type: string
          format: binary
      required:
      - file
      - owner_id
      - owner_type
    EnrollExistingRequest:
      type: object
      properties:
        student:
          type: integer
        class_group:
          type: integer
        enrollment_date:
          type: string
          format: date
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          default: re_enrolment
        previous_school:
          type: string
          default: ''
          maxLength: 200
        notes:
          type: string
          default: ''
      required:
      - class_group
      - student
    Enrollment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/EnrollmentStudent'
          readOnly: true
        academic_year:
          type: integer
          readOnly: true
        academic_year_name:
          type: string
          readOnly: true
        class_group:
          type: integer
          readOnly: true
        class_name:
          type: string
          readOnly: true
        level_name:
          type: string
          readOnly: true
        enrollment_date:
          type: string
          format: date
        kind:
          $ref: '#/components/schemas/KindEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/EnrollmentStatusEnum'
          readOnly: true
        previous_school:
          type: string
          maxLength: 200
        ended_on:
          type: string
          format: date
          readOnly: true
          nullable: true
        end_reason:
          type: string
          readOnly: true
        transfer_to:
          type: string
          readOnly: true
          description: School the student left for.
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_year
      - academic_year_name
      - class_group
      - class_name
      - created_at
      - end_reason
      - ended_on
      - enrollment_date
      - id
      - level_name
      - status
      - student
      - transfer_to
    EnrollmentBrief:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        kind:
          type: string
        enrollment_date:
          type: string
          format: date
        ended_on:
          type: string
          format: date
          nullable: true
        academic_year:
          type: integer
        academic_year_name:
          type: string
        class_group:
          type: integer
        class_name:
          type: string
        level_name:
          type: string
      required:
      - academic_year
      - academic_year_name
      - class_group
      - class_name
      - ended_on
      - enrollment_date
      - id
      - kind
      - level_name
      - status
    EnrollmentStatusEnum:
      enum:
      - active
      - class_changed
      - withdrawn
      - completed
      - cancelled
      type: string
      description: |-
        * `active` - Active
        * `class_changed` - Moved to another class
        * `withdrawn` - Left the school
        * `completed` - Year completed
        * `cancelled` - Cancelled
    EnrollmentStudent:
      type: object
      properties:
        id:
          type: integer
        student_number:
          type: string
        full_name:
          type: string
        gender:
          type: string
        date_of_birth:
          type: string
          format: date
          nullable: true
        photo_url:
          type: string
          nullable: true
      required:
      - date_of_birth
      - full_name
      - gender
      - id
      - photo_url
      - student_number
    GenderEnum:
      enum:
      - M
      - F
      type: string
      description: |-
        * `M` - Male
        * `F` - Female
    GrantAccessRequest:
      type: object
      properties:
        role_ids:
          type: array
          items:
            type: integer
      required:
      - role_ids
    Guardian:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          maxLength: 30
        alt_phone:
          type: string
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
        occupation:
          type: string
          maxLength: 100
        students:
          type: array
          items:
            $ref: '#/components/schemas/GuardianStudent'
          readOnly: true
      required:
      - first_name
      - full_name
      - id
      - last_name
      - students
    GuardianInputRequest:
      type: object
      description: Link an existing guardian (guardian_id) or create a new one from
        the other fields.
      properties:
        guardian_id:
          type: integer
          nullable: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 30
        alt_phone:
          type: string
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        address:
          type: string
        occupation:
          type: string
          maxLength: 100
        relationship:
          $ref: '#/components/schemas/RelationshipEnum'
        is_primary:
          type: boolean
          default: false
        is_financial_contact:
          type: boolean
          default: false
      required:
      - relationship
    GuardianLink:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        guardian:
          allOf:
          - $ref: '#/components/schemas/Guardian'
          readOnly: true
        relationship:
          $ref: '#/components/schemas/RelationshipEnum'
        is_primary:
          type: boolean
          description: Main contact for the school.
        is_financial_contact:
          type: boolean
          description: Receives invoices and payment reminders.
      required:
      - guardian
      - id
    GuardianLinkRequest:
      type: object
      properties:
        relationship:
          $ref: '#/components/schemas/RelationshipEnum'
        is_primary:
          type: boolean
          description: Main contact for the school.
        is_financial_contact:
          type: boolean
          description: Receives invoices and payment reminders.
    GuardianRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          maxLength: 30
        alt_phone:
          type: string
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
        occupation:
          type: string
          maxLength: 100
      required:
      - first_name
      - last_name
    GuardianStudent:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        relationship:
          type: string
      required:
      - full_name
      - id
      - relationship
    Homeroom:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    ImportUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        commit:
          type: boolean
          default: false
          description: false = check only; true = save if all valid
      required:
      - file
    KindEnum:
      enum:
      - new
      - re_enrolment
      - transfer_in
      type: string
      description: |-
        * `new` - New student
        * `re_enrolment` - Re-enrolment
        * `transfer_in` - Transfer from another school
    LanguageEnum:
      enum:
      - fr
      - en
      type: string
      description: |-
        * `fr` - French
        * `en` - English
    Level:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Position in the school, lowest first.
        cycle:
          $ref: '#/components/schemas/CycleEnum'
        is_active:
          type: boolean
        class_count:
          type: integer
          readOnly: true
      required:
      - class_count
      - id
      - name
    LevelRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Position in the school, lowest first.
        cycle:
          $ref: '#/components/schemas/CycleEnum'
        is_active:
          type: boolean
      required:
      - name
    LoginRequest:
      type: object
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - login
      - password
    Member:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/MemberUser'
          readOnly: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleBrief'
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - roles
      - user
    MemberCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          maxLength: 30
        language:
          $ref: '#/components/schemas/LanguageEnum'
        role_ids:
          type: array
          items:
            type: integer
        password:
          type: string
      required:
      - email
      - first_name
      - last_name
      - role_ids
    MemberUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        phone:
          type: string
          maxLength: 30
        language:
          $ref: '#/components/schemas/LanguageEnum'
        last_login:
          type: string
          format: date-time
          nullable: true
        has_password:
          type: boolean
          readOnly: true
      required:
      - email
      - full_name
      - has_password
      - id
      - username
    NewStudentRequest:
      type: object
      properties:
        student_number:
          type: string
          maxLength: 30
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        gender:
          $ref: '#/components/schemas/GenderEnum'
        date_of_birth:
          type: string
          format: date
          nullable: true
        place_of_birth:
          type: string
          maxLength: 100
        nationality:
          type: string
          maxLength: 60
        phone:
          type: string
          maxLength: 30
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        address:
          type: string
        notes:
          type: string
      required:
      - first_name
      - gender
      - last_name
    OwnerTypeEnum:
      enum:
      - student
      - staff
      - school
      type: string
      description: |-
        * `student` - Student
        * `staff` - Staff member
        * `school` - School
    PaginatedAuditLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
    PaginatedClassGroupList:
