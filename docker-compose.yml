# Local API stack mirroring the production services (PostgreSQL, Valkey, Celery worker + beat, email capture):
#   docker compose up --build
#   docker compose exec backend python manage.py migrate
#   docker compose exec backend python manage.py seed_demo
# API: http://localhost:8000/api/v1/  ·  API docs: http://localhost:8000/api/docs/  ·  Emails: http://localhost:8025
# The web app (Mon-Ecole repository) runs separately and talks to this API on port 8000.

name: mon-ecole-backend

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.local
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,host.docker.internal
  DATABASE_URL: postgres://monecole:monecole@db:5432/monecole
  REDIS_URL: redis://valkey:6379/0
  CELERY_TASK_ALWAYS_EAGER: "False"
  FRONTEND_URL: http://localhost:5173
  # 5173 = Vite dev server, 8080 = the frontend's nginx image
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"

x-backend: &backend
  build: .
  image: mon-ecole-backend:dev
  environment: *backend-env
  volumes: [".:/app"]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monecole
      POSTGRES_USER: monecole
      POSTGRES_PASSWORD: monecole
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monecole"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"]

  backend:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_started }

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info
    depends_on: [backend]

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info
    depends_on: [backend]

volumes:
  pgdata:
