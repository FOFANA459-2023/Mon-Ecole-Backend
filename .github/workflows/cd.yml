# Delivery pipeline:
#   push to main  → CI → multi-arch image on GHCR → deploy to staging   (when DEPLOY_STAGING = true)
#   tag v1.2.3    → CI → multi-arch image on GHCR → deploy to production (when DEPLOY_PRODUCTION = true;
#                                                   add required reviewers to the "production" environment)
# Deploy settings live in GitHub → Settings → Environments; see README "Deployment".
name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/fofana459-2023/mon-ecole-backend

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and publish image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 for AWS Fargate (Graviton), amd64 for local machines and other hosts.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_STAGING == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.image.outputs.image }}
    permissions:
      contents: read
      packages: read
      id-token: write

  deploy-production:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_PRODUCTION == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.image.outputs.image }}
    permissions:
      contents: read
      packages: read
      id-token: write
